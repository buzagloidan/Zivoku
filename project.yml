name: SudokuForZiv
options:
  bundleIdPrefix: com.idanbu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"

configs:
  Debug: debug
  Release: release

targets:
  SudokuForZiv:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SudokuForZiv
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idanbu.SudokuForZiv
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: "ZADSZ6HP53"
        INFOPLIST_FILE: SudokuForZiv/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_STRICT_CONCURRENCY: targeted
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ENABLE_PREVIEWS: YES

  SudokuForZivTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SudokuForZivTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idanbu.SudokuForZivTests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: targeted
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SudokuForZiv

schemes:
  SudokuForZiv:
    build:
      targets:
        SudokuForZiv: [run, test, profile, analyze, archive]
    test:
      targets:
        - SudokuForZivTests
    run:
      executable: SudokuForZiv
